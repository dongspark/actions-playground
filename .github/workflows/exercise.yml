name: Hello World

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  
env:                      # ← 新增：顶层 env，和 on、jobs 同级
  APP_ENV: development
  
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello, GitHub Actions!"
      - name: List files
        run: ls -la
        
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building project"
      - run: echo "Environment is $APP_ENV"   # ← 新增：打印变量

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running tests"
